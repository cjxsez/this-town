# Every push and pull request: typecheck, build the three web apps, run the JS tests
# (protocol game rules, worker matching/missions/MBTA, t-map, start screen) and the
# kiosk Pi agent's pytest suite. The smoke job also boots a local worker and runs
# pnpm smoke in both GAMES_ONLY modes (D26).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, build, test (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  kiosk-pi:
    name: Kiosk Pi agent (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kiosk-pi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/kiosk-pi/pyproject.toml
      # The dev extra only: rpi_ws281x and the SPI driver don't build off a Pi.
      - run: pip install -e ".[dev]"
      - run: shellcheck scripts/setup.sh
      - run: pytest -q

  smoke:
    name: Worker smoke (games-only and missions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Write throwaway .dev.vars
        run: |
          printf '%s\n' \
            'KIOSK_KEY=ci-smoke-throwaway-key-not-for-prod' \
            'ANTHROPIC_API_KEY=' \
            'MBTA_API_KEY=' \
            > apps/worker/.dev.vars
      - name: Migrate local D1
        run: pnpm db:migrate:local
      # wrangler.toml assets.directory=./public; smoke only hits /api and /ws, so an empty
      # dir is enough (same as `mkdir -p` in apps/worker/README.md for a fresh clone).
      - name: Ensure worker public/ exists
        run: mkdir -p apps/worker/public
      # Missions smoke uses 8788 so a lingering games-only workerd on 8787 cannot answer
      # /api/health with gamesOnly:true (wrangler's child often outlives the shell PID).
      - name: Smoke games-only (default)
        run: |
          set -euo pipefail
          LOG=/tmp/worker-games-only.log
          PORT=8787
          (
            cd apps/worker
            npx wrangler dev --port "$PORT" --ip 127.0.0.1
          ) >"$LOG" 2>&1 &
          WORKER_PID=$!
          cleanup() {
            kill "$WORKER_PID" 2>/dev/null || true
            pkill -f "wrangler dev --port ${PORT}" 2>/dev/null || true
            # workerd keeps the port after wrangler exits; free it explicitly.
            if command -v fuser >/dev/null 2>&1; then
              fuser -k "${PORT}/tcp" 2>/dev/null || true
            fi
            wait "$WORKER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in $(seq 1 90); do
            if curl -sf "http://127.0.0.1:${PORT}/api/health" >/dev/null; then
              echo "worker healthy after ${i}s"
              break
            fi
            if ! kill -0 "$WORKER_PID" 2>/dev/null; then
              echo "worker exited before healthy"
              cat "$LOG" || true
              exit 1
            fi
            sleep 1
            if [ "$i" -eq 90 ]; then
              echo "timed out waiting for /api/health"
              cat "$LOG" || true
              exit 1
            fi
          done
          if ! pnpm smoke; then
            echo "---- worker log (games-only) ----"
            cat "$LOG" || true
            exit 1
          fi
      - name: Smoke missions (GAMES_ONLY:false)
        run: |
          set -euo pipefail
          LOG=/tmp/worker-missions.log
          PORT=8788
          (
            cd apps/worker
            npx wrangler dev --port "$PORT" --ip 127.0.0.1 --var GAMES_ONLY:false
          ) >"$LOG" 2>&1 &
          WORKER_PID=$!
          cleanup() {
            kill "$WORKER_PID" 2>/dev/null || true
            pkill -f "wrangler dev --port ${PORT}" 2>/dev/null || true
            if command -v fuser >/dev/null 2>&1; then
              fuser -k "${PORT}/tcp" 2>/dev/null || true
            fi
            wait "$WORKER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in $(seq 1 90); do
            if curl -sf "http://127.0.0.1:${PORT}/api/health" >/dev/null; then
              echo "worker healthy after ${i}s"
              HEALTH=$(curl -sf "http://127.0.0.1:${PORT}/api/health")
              echo "$HEALTH"
              echo "$HEALTH" | grep -q '"gamesOnly":false' || {
                echo "expected gamesOnly false"
                cat "$LOG" || true
                exit 1
              }
              break
            fi
            if ! kill -0 "$WORKER_PID" 2>/dev/null; then
              echo "worker exited before healthy"
              cat "$LOG" || true
              exit 1
            fi
            sleep 1
            if [ "$i" -eq 90 ]; then
              echo "timed out waiting for /api/health"
              cat "$LOG" || true
              exit 1
            fi
          done
          if ! WORKER_URL="http://127.0.0.1:${PORT}" pnpm smoke; then
            echo "---- worker log (missions) ----"
            cat "$LOG" || true
            exit 1
          fi
