# Every push and pull request: typecheck, build the three web apps, run the JS tests
# (protocol game rules, worker matching/missions/MBTA, t-map, start screen) and the
# kiosk Pi agent's pytest suite. Nothing here talks to MBTA, Anthropic or Cloudflare.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, build, test (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  kiosk-pi:
    name: Kiosk Pi agent (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kiosk-pi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/kiosk-pi/pyproject.toml
      # The dev extra only: rpi_ws281x and the SPI driver don't build off a Pi.
      - run: pip install -e ".[dev]"
      - run: shellcheck scripts/setup.sh
      - run: pytest -q
