<!doctype html>
<!--
  phone-web entry HTML. Mobile viewport (covers the notch via viewport-fit=cover;
  styles.css pads with safe-area insets). Vite injects the bundle from src/main.tsx.
  Served at "/" and as the SPA fallback for every client route, including /k/:car.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />
    <title>Questline</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
